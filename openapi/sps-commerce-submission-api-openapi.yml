openapi: 3.2.0
info:
  title: Community Submission API
  description: The Submission API allows Community Buying Organizations to access if they would like to automate the submission process of new vendors to their Community program with SPS Commerce.
  version: 1.0.0
servers:
- url: https://api.spscommerce.com/submissions
  description: prod environment
tags:
- name: Submission
  description: Operations with Submission Form entities. Require `Bearer` token authentication
paths:
  /v1/trading-partners:
    post:
      tags:
      - Submission
      summary: Trading Partner Submission
      description: Allows Buying Organizations to submit suppliers to SPS Commerce for onboarding.
      operationId: create_lead_v1_trading_partners_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingPartnerInput'
        required: true
      responses:
        '201':
          description: Trading Partners were created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingPartnerResponse'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Submission Form isn't found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /v1/forms:
    get:
      tags:
      - Submission
      summary: List of all available Submission Forms
      description: 'Provides a list of available submission forms based on the

        Buying Organization''s relationship with that supplier

        based on the business requirements.'
      operationId: get_forms_v1_forms_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 1
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionFormsResponse'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '400':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/forms/{id}:
    get:
      tags:
      - Submission
      summary: Get a specific Submission Form
      description: 'Provides a requested submission form.

        User can retrieve only submission form under their organization


        There will be shown only forms, available and enabled in the

        Community UI preferences'
      operationId: get_form_v1_forms__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionFormOutput'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          description: Submission Form isn't found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
