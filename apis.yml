aid: sps-commerce

name: SPS Commerce

description: SPS Commerce (Minneapolis, MN) is a retail supply-chain network and cloud services company offering EDI, sales and item data solutions
  that connect suppliers, retailers, distributors, 3PLs and logistics providers across 300,000+ trading relationships. Its Dev Center (developercenter.spscommerce.com)
  exposes OAuth-secured API services such as the Transaction API, Shipping Doc API and Trading Partner Submission API, plus MCP documentation,
  and the company publishes its open SPS API Standards and Spectral ruleset on GitHub.

