apis:
- name: SPS Commerce Trading Partner Submission API
  description: >-
    The Trading Partner Submission API allows Community Buying Organizations to automate the submission
    of new vendors to their Community program with SPS Commerce (create trading-partner leads, list and
    read submission forms). OAuth 2.0 bearer tokens issued through Dev Center.
  humanURL: https://developercenter.spscommerce.com/#/docs/trading-partner-submission-api
  baseURL: https://api.spscommerce.com/submissions
  tags:
  - Trading Partners
  - Supplier Onboarding
  properties:
  - type: OpenAPI
    url: openapi/sps-commerce-submission-api-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: https://api.spscommerce.com/submissions/openapi.json
  - type: OpenAPI
    name: OpenAPI (provider-hosted, integration environment)
    url: https://integration.api.spscommerce.com/submissions/openapi.json
  - type: Documentation
    url: https://developercenter.spscommerce.com/#/docs/trading-partner-submission-api
  - type: JSONSchema
    url: json-schema/sps-commerce-trading-partner-input-schema.json
  - type: JSONSchema
    url: json-schema/sps-commerce-submission-form-output-schema.json
  - type: JSONSchema
    url: json-schema/sps-commerce-trading-partner-response-schema.json
  - type: JSONSchema
    url: json-schema/sps-commerce-submission-forms-response-schema.json
  aid: sps-commerce:sps-commerce-trading-partner-submission-api
- name: SPS Commerce Inventory API
  description: >-
    Inventory API for listing and reading items by SPS item ID and creating inventory imports. Its OpenAPI
    is published on the SPS Dev Center CDN, but the Dev Center service catalog marks the service inactive
    (active false) and it is not linked from the Dev Center navigation.
  humanURL: https://developercenter.spscommerce.com/
  baseURL: https://api.spscommerce.com
  tags:
  - Inventory
  properties:
  - type: OpenAPI
    url: openapi/sps-commerce-inventory-api-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: >-
      https://cdn.prod.spsc.io/web/inventory-api/api/inventory-api-docs/1.30.0/swaggerhub/openapi.json
  - type: JSONSchema
    url: json-schema/sps-commerce-inventory-import-request-schema.json
  - type: JSONSchema
    url: json-schema/sps-commerce-inline-response-200-schema.json
  aid: sps-commerce:sps-commerce-inventory-api
- name: SPS Commerce Transaction API
  description: >-
    Transaction API (v5) for creating, filtering, getting and deleting EDI/XML transaction files and viewing
    interaction history across the SPS retail network. Documented in Dev Center; no machine-readable contract
    is published (api.spscommerce.com/transactions/v5/openapi.json answers 401).
  humanURL: https://developercenter.spscommerce.com/#/docs/transaction-api
  baseURL: https://api.spscommerce.com/transactions/v5
  tags:
  - EDI
  - Transaction
  tags_raw:
  - EDI
  - Transactions
  properties:
  - type: Documentation
    url: https://developercenter.spscommerce.com/#/docs/transaction-api
  aid: sps-commerce:sps-commerce-transaction-api
- name: SPS Commerce Shipping Doc API
  description: >-
    Shipping Doc API for retrieving shipping label and packing slip schemas and samples, and rendering
    labels (PDF/ZPL) and packing slips individually or in batches. Documented in Dev Center; no machine-readable
    contract is published (api.spscommerce.com/label/v1/openapi.json answers 401).
  humanURL: https://developercenter.spscommerce.com/#/docs/shipping-doc-api
  baseURL: https://api.spscommerce.com/label/v1
  tags:
  - Shipping
  - Labels
  properties:
  - type: Documentation
    url: https://developercenter.spscommerce.com/#/docs/shipping-doc-api
  aid: sps-commerce:sps-commerce-shipping-doc-api
- aid: sps-commerce:sps-commerce-import-api
  name: SPS Commerce Import API
  description: The Import API from SPS Commerce — 1 operation(s) for import.
  humanURL: https://developercenter.spscommerce.com/#/docs/trading-partner-submission-api
  baseURL: https://api.spscommerce.com/submissions
  tags:
  - Import
